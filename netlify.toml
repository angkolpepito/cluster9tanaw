[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  # The Supabase URL is public by design (it is in config.js). Never add SUPABASE_SERVICE_KEY here.
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
